name: CI

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

jobs:
    test:
        runs-on: ubuntu-latest
        services:
          postgres:
            image: postgres:16
            env:
                POSTGRES_DB: tracker_test
                POSTGRES_USER: postgres
                POSTGRES_PASSWORD: postgres
            ports:
                - "5432:5432"
            options: >-
                --health-cmd pg_isready
                --health-interval 10s
                --health-timeout 5s
                --health-retries 5
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-python@v5
              with:
                  python-version: "3.12"
            - run: |
                    python -m pip install --upgrade pip
                    pip install -r requirements.txt
                    pip install pytest
                    pip install pytest-cov
            - name: Run test
              env:
                TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/tracker_test
                SECRET_KEY: ${{ secrets.SECRET_KEY }}
                DUMMY_HASH: ${{ secrets.DUMMAY_HASH }}
              run: |
                      pytest --cov=app --cov-report=term-missing --cov-fail-under=85
