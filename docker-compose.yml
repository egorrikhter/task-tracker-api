services:
    postgres:
        image: postgres:16-alpine
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
            interval: 10s
            timeout: 5s
            retries: 5
        container_name: postgres
        volumes:
            - postgresql_data:/var/lib/postgresql/data
        env_file:
            - .env
        ports:
            - "5432:5432"
volumes:
    postgresql_data:
